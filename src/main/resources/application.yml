spring:
  profles:
    - dev
    - prod
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  application:
    name: metrichive


  datasource:
    url: jdbc:postgresql://localhost:5432/metrichive
    username: metrichive
    password: metrichive123
    driver-class-name: org.postgresql.Driver


    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: MetricHivePool

  # JPA Settings
  jpa:
    hibernate:
      ddl-auto: validate  # NEVER use 'update' in production! this checks if the tables and columns are there or not
      #you can use create , create-drop, update for more things to happen when shutdown
    show-sql: false  # We'll use logging instead , not good for logging and performance
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 50  # For batch inserts
        order_inserts: true
        order_updates: true

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 300000  # 5 minutes
  web:
    error:
      include-message: always
      include-stacktrace: never

# Logging
logging:
  level:
    com.metrichive: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.zaxxer.hikari: DEBUG  # Monitor connection pool

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Server
server:
  port: 8080