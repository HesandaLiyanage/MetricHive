name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  # 1. Linting with Checkstyle
  lint:
    name: 1. Lint (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run Checkstyle
        run: ./mvnw checkstyle:check

  # 2. Unit & Integration Tests
  test:
    name: 2. Test (JUnit & Integration)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run Tests
        run: ./mvnw test

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  # 3. Security Scan on Filesystem
  security-fs:
    name: 3. Security (Filesystem Scan)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL'
          exit-code: '1'
          trivyignores: '.trivyignore'

  # 4. Container Build
  build:
    name: 4. Build (Docker Image)
    runs-on: ubuntu-latest
    needs: [test, security-fs]
    outputs:
      image_tag: ${{ steps.prep.outputs.tag }}
      image_ref: ${{ steps.prep.outputs.image_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Image Reference
        id: prep
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REF="ghcr.io/${OWNER_LOWER}/metrichive"
          TAG="${{ github.sha }}"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build \
            -t "${{ steps.prep.outputs.image_ref }}:${{ steps.prep.outputs.tag }}" \
            -t "${{ steps.prep.outputs.image_ref }}:latest" .

      - name: Save Docker Image Artifact
        run: |
          docker save "${{ steps.prep.outputs.image_ref }}:${{ steps.prep.outputs.tag }}" -o metrichive.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrichive-image
          path: metrichive.tar
          retention-days: 1

  # 5. Security Scan on Container Image
  security-image:
    name: 5. Security (Container Image Scan)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: metrichive-image

      - name: Load Docker Image
        run: |
          docker load -i metrichive.tar

      - name: Run Trivy Container Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ needs.build.outputs.image_ref }}:${{ needs.build.outputs.image_tag }}'
          scan-type: 'image'
          severity: 'CRITICAL'
          exit-code: '1'
          trivyignores: '.trivyignore'

  # 6. Push to GHCR (Main branch on push only)
  push:
    name: 6. Push (Publish to GHCR)
    runs-on: ubuntu-latest
    needs: [build, security-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: metrichive-image

      - name: Load Docker Image
        run: |
          docker load -i metrichive.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Container Images to GHCR
        run: |
          docker push "${{ needs.build.outputs.image_ref }}:${{ needs.build.outputs.image_tag }}"
          docker tag "${{ needs.build.outputs.image_ref }}:${{ needs.build.outputs.image_tag }}" "${{ needs.build.outputs.image_ref }}:latest"
          docker push "${{ needs.build.outputs.image_ref }}:latest"
