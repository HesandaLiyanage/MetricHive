services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - metrichive-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: metrichive-db-prod
    environment:
      POSTGRES_DB: metrichive_prod
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d metrichive_prod"]
      interval: 10s
      timeout: 10s
      retries: 3
    networks:
      - metrichive-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: metrichive-redis-prod
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - metrichive-network
    restart: unless-stopped

volumes:
  postgres_data_prod:

networks:
  metrichive-network:
    driver: bridge