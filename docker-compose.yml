services:
  app:
    build: .
    image: metrichive:local
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/metrichive_dev
      - DB_USERNAME=metrichive
      - DB_PASSWORD=metrichive123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - metrichive-network

  postgres:
    image: postgres:15-alpine
    container_name: metrichive-db-dev
    environment:
      POSTGRES_DB: metrichive_dev
      POSTGRES_USER: metrichive
      POSTGRES_PASSWORD: metrichive123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrichive -d metrichive_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - metrichive-network

  redis:
    image: redis:7-alpine
    container_name: metrichive-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - metrichive-network

volumes:
  postgres_data_dev:

networks:
  metrichive-network:
    driver: bridge