services:
  postgres:
    image: postgres:15-alpine
    container_name: metrichive-db
    environment:
      POSTGRES_DB: metrichive
      POSTGRES_USER: metrichive
      POSTGRES_PASSWORD: metrichive123
    ports:
      - "5433:5432"  # ← Changed from 5432:5432 to 5433:5432
      # Your Mac port 5433 maps to container's internal 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrichive"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: metrichive-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: